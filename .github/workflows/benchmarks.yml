name: Refresh ETF benchmark history
on:
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * 2-6'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate historical ETF data
        run: python scripts/update_benchmarks.py
      - name: Commit refreshed benchmark data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh historical ETF benchmarks"
            git push
          fi
