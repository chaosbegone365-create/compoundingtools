name: Calculator and browser quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false
    # Standard public-repository runner; no larger runner, cache or paid service.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run static, numerical and mocked-DOM regression checks
        run: npm run test:static
      - name: Install Chromium for CI
        run: npx --no-install playwright install --with-deps chromium
      - name: Run desktop and mobile-viewport browser tests
        run: npm run test:browser
        env:
          CI: 'true'
    # No artifact uploads or dependency cache: no storage-overage exposure.
