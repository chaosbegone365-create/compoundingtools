name: Deploy CompoundingTools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate calculator math, scripts, and technical SEO
        run: |
          node tests/script-syntax.cjs
          node tests/calculator-regressions.cjs
          node tests/comparison-unit.cjs
          node tests/household-regressions.cjs
          node tests/mortgage-content.cjs
          node tests/planner-regressions.cjs
          python3 tests/seo_static.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
